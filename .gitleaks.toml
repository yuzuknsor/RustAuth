# gitleaks 配置：默认规则 + 公开测试向量白名单
# RFC 4226/6238 附录官方密钥与 Google Authenticator 文档示例值为公开文档值，
# 按内容放行（任何文件出现均非泄漏）；真实密钥永不入库
# （.gitignore 拦 vault/旧配置 + 开发红线 + 本扫描兜底）。

[extend]
useDefault = true

[allowlist]
description = "RFC 4226/6238 official test vectors & Google Authenticator doc examples"
regexes = [
  '''12345678901234567890''',
  '''12345678901234567890123456789012''',
  '''1234567890123456789012345678901234567890123456789012345678901234''',
  '''JBSWY3DPEHPK3PXP''',
  '''GEZDGNBVGY3TQOJQ''',
]
