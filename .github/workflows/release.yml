name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p rustauth-gui

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/rustauth.exe dist/
          Copy-Item README.md, LICENSE, NOTICE, docs/vault-format-v1.md dist/
          Compress-Archive -Path dist/* -DestinationPath RustAuth-${{ github.ref_name }}-windows-x64.zip

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: RustAuth-*.zip
          generate_release_notes: true
