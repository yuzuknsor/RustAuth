[workspace]
resolver = "2"
members = ["crates/rustauth-core", "crates/rustauth-gui", "crates/rustauth-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
