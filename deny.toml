# cargo-deny 配置：依赖许可审计
# 政策：本工程 outbound 为 AGPL-3.0-or-later，依赖只接受宽纵许可；
# 明确拒绝任何 copyleft（GPL/AGPL/LGPL/SSPL/BUSL）依赖进入依赖树。

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # eframe 0.37 内嵌 Ubuntu-Light 字体（数据而非代码），上游默认分发
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # option-ext（dirs 传递依赖）：MPL-2.0 弱文件级 copyleft，与 AGPL-3.0 义务兼容
  "MPL-2.0",
]
confidence-threshold = 0.93

# 工作区自身 crate 以 AGPL-3.0-or-later 发布（outbound 许可）；
# 依赖树仍然只允许上面的宽纵清单（copyleft 依赖一律拒绝）。
[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "rustauth-core"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "rustauth-gui"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "rustauth-cli"

[bans]
multiple-versions = "warn"
# 拒绝一切通配版本依赖（工作区内部依赖已在 Cargo.toml 钉死 version）
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
